app-id: ua.net.zimavi.Shirabe
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: shirabe

finish-args:
  - --share=ipc
  - --socket=x11 # Avalonia has no Wayland backend unless the app opts in; this covers XWayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-music # read-write: the app writes tags
  - --talk-name=org.freedesktop.secrets

build-options:
  strip: false # the release is already built; stripping breaks .NET binaries
  no-debuginfo: true

modules:
  - name: shirabe
    buildsystem: simple
    # scripts/bump.sh rewrites VERSION, RELEASE_DATE, url and sha256.
    build-options:
      env:
        VERSION: '0.1.0'
        RELEASE_DATE: '2026-11-24'
    build-commands:
      - mkdir -p /app/shirabe /app/bin
      - cp -a release/. /app/shirabe/
      - test -x /app/shirabe/Shirabe
      - ln -s /app/shirabe/Shirabe /app/bin/shirabe
      - install -Dm644 ua.net.zimavi.Shirabe.desktop -t /app/share/applications
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/ua.net.zimavi.Shirabe.png
      - sed -i "s/@VERSION@/$VERSION/; s/@RELEASE_DATE@/$RELEASE_DATE/" ua.net.zimavi.Shirabe.metainfo.xml
      - sed -i 's/<component /<component priority="1" /' ua.net.zimavi.Shirabe.metainfo.xml
      - install -Dm644 ua.net.zimavi.Shirabe.metainfo.xml -t /app/share/metainfo
    sources:
      - type: archive
        url: https://github.com/zimavi/Shirabe.Client/releases/download/v0.1.0/Shirabe-0.1.0-linux-x64.tar.gz
        sha256: db35c76e2fcb9a58ed4ad5c12575b2de2a6473e6dec8aae09aea3b1a4ab74292
        dest: release
      - type: file
        path: ua.net.zimavi.Shirabe.desktop
      - type: file
        path: ua.net.zimavi.Shirabe.metainfo.xml
      - type: file
        path: icon-512.png
